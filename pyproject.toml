[project]
name = "aurora-casino"
version = "0.1.0"
description = "Aurora — Telegram Mini App casino with provably-fair games, bonuses, referrals and Rukassa payments."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "aiogram>=3.4,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.19",
  "asyncpg>=0.29; python_version<'3.13'",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: FastAPI uses Depends() in defaults — required pattern.
# UP042: We keep `str, Enum` mixins for SQLAlchemy compatibility on 3.11.
# UP045: Optional[X] is intentional in some places.
# SIM108: ternary not always more readable.
ignore = ["E501", "B008", "UP042", "UP045", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "B007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
