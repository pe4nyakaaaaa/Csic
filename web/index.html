<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Aurora Casino</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="aurora-bg" aria-hidden="true">
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
  </div>

  <header class="topbar">
    <button class="logo" data-route="lobby">
      <img src="/assets/logo.svg" alt="Aurora" />
      <span>Aurora</span>
    </button>
    <button class="balance-pill" data-route="wallet" id="balance-pill">
      <span class="bal-icon">💰</span>
      <span class="bal-value">…</span>
      <span class="bal-currency">AC</span>
    </button>
  </header>

  <main id="app" class="app"></main>

  <nav class="tabs">
    <button class="tab" data-route="lobby" aria-label="Лобби">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-7H10v7H6a2 2 0 0 1-2-2v-1z"/></svg>
      <span>Лобби</span>
    </button>
    <button class="tab" data-route="games" aria-label="Игры">
      <svg viewBox="0 0 24 24"><path d="M7 6h10a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4 4 4 0 0 1-3.46-2H9.46A4 4 0 0 1 6 18a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4z"/></svg>
      <span>Игры</span>
    </button>
    <button class="tab" data-route="bonuses" aria-label="Бонусы">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.5 5 5.5.8-4 3.9.95 5.5L12 14.6l-4.95 2.6L8 11.7 4 7.8 9.5 7z"/></svg>
      <span>Бонусы</span>
    </button>
    <button class="tab" data-route="wallet" aria-label="Кошелёк">
      <svg viewBox="0 0 24 24"><path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v2H6a1 1 0 0 0 0 2h15v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/></svg>
      <span>Кошелёк</span>
    </button>
    <button class="tab" data-route="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-3.3 0-7 1.7-7 5v2h14v-2c0-3.3-3.7-5-7-5z"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <div class="toast-host" id="toast-host"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
